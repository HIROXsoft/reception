<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合受付システム</title>
    <style>
        /* ========================================================
           🎨 【デザイン調整スイッチ】
           ======================================================== */
        :root {
            /* 🔷 背景（グラデーション） */
            --bg-start: #e0f2fe;            
            --bg-end: #bae6fd;      

            /* 🔘 通常ボタン（グラデーション） */
            --btn-start: #1d4ed8;               
            --btn-end: #3b82f6;     

            /* 🟢 担当者ボタン（グラデーション） */
            --btn-green-start: #2f855a;         
            --btn-green-end: #48bb78;   

            /* 📐 メインボタンのサイズと形状（角R） */
            --btn-padding: 30px;    
            --btn-font-size: 26px;  
            --btn-radius: 10px;     

            /* 🌐 言語切替ボタンの調整スイッチ */
            --lang-font-size: 16px;   
            --lang-padding-y: 12px;   
            --lang-padding-x: 24px;   
            --lang-radius: 30px;      
            
            /* 📍 言語切替ボタンの位置調整 */
            --lang-position-bottom: 60px; 
            --lang-position-right: 160px;  
        }

        /* ========================================================
           基本スタイル
           ======================================================== */
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: #1e3a8a;
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: bold;
            text-align: center;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.3s ease-in-out;
        }
        .page.active {
            display: block;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--btn-start), var(--btn-end));
            color: white;
            font-size: var(--btn-font-size);
            font-weight: bold;
            text-decoration: none;
            padding: var(--btn-padding);
            border-radius: var(--btn-radius);
            border: none;
            box-shadow: 0 6px 15px rgba(29, 78, 216, 0.15);
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
            box-sizing: border-box;
        }
        .main-btn:active {
            filter: brightness(0.85); 
            transform: scale(0.96);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--btn-green-start), var(--btn-green-end));
            box-shadow: 0 6px 15px rgba(47, 133, 90, 0.15);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            background-color: #64748b;
            color: white;
            font-size: 18px;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .back-btn:active {
            background-color: #475569;
        }

        .lang-container {
            position: fixed;
            bottom: var(--lang-position-bottom);
            right: var(--lang-position-right);
        }
        .lang-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: #1e3a8a;
            border: 1px solid #bae6fd;
            font-size: var(--lang-font-size);
            font-weight: bold;
            padding: var(--lang-padding-y) var(--lang-padding-x);
            border-radius: var(--lang-radius);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.1s, background-color 0.1s;
        }
        .lang-btn:active {
            background-color: #e0f2fe;
            transform: scale(0.95);
        }

        /* 📞 呼出中画面のスタイル */
        .status-msg {
            font-size: 24px;
            color: #1e3a8a;
            font-weight: bold;
            margin-top: 20px;
            line-height: 1.6;
        }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #1d4ed8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========================================================
           📞 iOS風 発信ポップアップ
           ======================================================== */
        .ios-call-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 24px;
            box-sizing: border-box;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }
        .ios-call-overlay.active {
            display: flex;
        }
        .ios-call-sheet {
            width: 100%;
            max-width: 430px;
            background: rgba(36, 52, 64, 0.96);
            border-radius: 28px;
            padding: 14px 16px 18px;
            box-sizing: border-box;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        }
        .ios-call-action {
            width: 100%;
            border: none;
            border-radius: 28px;
            min-height: 64px;
            padding: 12px 16px;
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            background: #18aef5;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            white-space: normal;
            line-height: 1.25;
        }
        .ios-call-action:active {
            filter: brightness(0.9);
            transform: scale(0.98);
        }
        .ios-call-cancel {
            width: 100%;
            border: none;
            border-radius: 28px;
            min-height: 64px;
            margin-top: 12px;
            padding: 12px 16px;
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(96, 111, 122, 0.88);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-call-cancel:active {
            filter: brightness(0.9);
            transform: scale(0.98);
        }

    </style>
</head>
<body>

    <div id="page-top" class="page active">
        <h1 id="text-top-title">いらっしゃいませ。ご用件をお選びください</h1>
        <div class="btn-container">
            <button class="main-btn" onclick="triggerCall('05017530562')" id="btn-general">総合受付</button>         
            <button class="main-btn" onclick="triggerCall('05017530562')" id="btn-delivery">配達・集荷</button>
            <button class="main-btn" onclick="showPage('page-dept')" id="btn-call">担当者呼出</button>
        </div>
    </div>

    <div id="page-dept" class="page">
        <h1 id="text-dept-title">担当の部署をお選びください</h1>
        <div class="btn-container">
            <button class="main-btn" onclick="showPage('page-staff-sales')" id="btn-sales">営業部</button>
            <button class="main-btn" onclick="showPage('page-staff-gyomu')" id="btn-gyomu">業務部</button>
            <button class="main-btn" onclick="showPage('page-staff-tech')" id="btn-tech">技術製造部</button>
            <button class="main-btn btn-green" onclick="showPage('page-staff-hirox')" id="btn-hirox">株式会社ハイロックスジャパン東京営業所</button>
        </div>
        <button class="back-btn" onclick="showPage('page-top')" id="btn-back-1">◀ 戻る</button>
    </div>

    <div id="page-staff-sales" class="page">
        <h1 id="text-sales-title">営業部の担当者をお選びください</h1>
        <div class="btn-container">
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000001')" data-ja="中島 俊和" data-en="Toshikazu Nakajima">中島 俊和</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000002')" data-ja="小林 大真" data-en="Oma kobayasi">小林 大真</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000002')" data-ja="前川 泰司" data-en=" Taiji Maekawa">前川 泰司</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000002')" data-ja="川越 次郎" data-en="Jiro Kawagoe">川越 次郎</button>
        </div>
        <button class="back-btn" onclick="showPage('page-dept')" id="btn-back-2">◀ 戻る</button>
    </div>

    <div id="page-staff-gyomu" class="page">
        <h1 id="text-gyomu-title">業務部の担当者をお選びください</h1>
        <div class="btn-container">
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000005')" data-ja="吉田 絢香" data-en="Ayaka Yoshida">吉田 絢香</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000006')" data-ja="泉 なぎさ" data-en="Nagisa Izumi">泉 なぎさ</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000006')" data-ja="西野 花音" data-en="Kaon Nishino">西野 花音</button>
        </div>
        <button class="back-btn" onclick="showPage('page-dept')" id="btn-back-4">◀ 戻る</button>
    </div>

    <div id="page-staff-tech" class="page">
        <h1 id="text-tech-title">技術製造部の担当者をお選びください</h1>
        <div class="btn-container">
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000003')" data-ja="上代 永" data-en="Hisashi Kajiroi">上代 永</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000004')" data-ja="竹内 孝全" data-en="Takamasa Tkeuchi">竹内 孝全</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000004')" data-ja="福家 三郎" data-en="Saburo Fuke">福家 三郎</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000004')" data-ja="岡田 拓矢" data-en="Takuya Okada">岡田 拓矢</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('05000000004')" data-ja="正岡 正雄" data-en="Masao Masaoka">正岡 正雄</button>
        </div>
        <button class="back-btn" onclick="showPage('page-dept')" id="btn-back-3">◀ 戻る</button>
    </div>

    <div id="page-staff-hirox" class="page">
        <h1 id="text-hirox-title">東京営業所の担当者をお選びください</h1>
        <div class="btn-container">
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('050XXXX1111')" data-ja="東京 太郎" data-en="Taro Tokyo">東京 太郎</button>
            <button class="main-btn btn-green staff-btn" onclick="triggerCall('050XXXX2222')" data-ja="東京 花子" data-en="Hanako Tokyo">東京 花子</button>
        </div>
        <button class="back-btn" onclick="showPage('page-dept')" id="btn-back-5">◀ 戻る</button>
    </div>

    <div id="page-calling" class="page" style="text-align: center;">
        <h1 id="text-calling-title">ただいま呼び出しております</h1>
        <div id="calling-status-area">
            <div class="loader"></div>
            <p class="status-msg" id="text-calling-msg">Dialpadアプリを起動しています。<br>そのままで少々お待ちください。</p>
            <p class="status-msg" style="font-size:16px; font-weight:normal;">
                Dialpadアプリから発信しています。<br>
                そのままで少々お待ちください。
            </p>
        </div>
    </div>


    <div class="ios-call-overlay" id="ios-call-overlay">
        <div class="ios-call-sheet">
            <button class="ios-call-action" onclick="confirmDialpadCall()" id="ios-call-action">
                発信 050 1753 0562,,,,1
            </button>
            <button class="ios-call-cancel" onclick="cancelCall()" id="ios-call-cancel">
                キャンセル
            </button>
        </div>
    </div>

    <div class="lang-container" id="lang-bar">
        <button class="lang-btn" onclick="toggleLanguage()" id="btn-lang">English</button>
    </div>

    <script>
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            if(pageId === 'page-calling') {
                document.getElementById('lang-bar').style.display = 'none';
            } else {
                document.getElementById('lang-bar').style.display = 'block';
            }
        }

        // ========================================================
        // 📞 iOS風ポップアップ表示 → Dialpadアプリ発信
        // ========================================================
        // 見た目:
        //   「発信 050 1753 0562,,,,1」のように、iOSの tel: 確認ポップアップ風に表示します。
        //
        // 実際の発信:
        //   tel: ではなく dialpad:// を使い、Dialpadアプリへ渡します。
        //
        // 重要:
        //   iPadOS / Safari側の仕様により、dialpad:// 起動時に
        //   「“DialPad”で開きますか？」が別途出る場合があります。
        //   これはWebページ側だけでは完全には消せません。

        const DIALPAD_FROM_NUMBER = ""; // 例: "+815012345678"。空欄ならDialpad側の既定番号。
        let pendingDisplayNumber = "";
        let pendingDialpadUrl = "";

        function normalizeJapanPhoneNumber(phoneNumber) {
            let n = String(phoneNumber).replace(/[^\d+]/g, "");

            // Dialpadへは +81 形式で渡す
            if (n.startsWith("0")) {
                n = "+81" + n.slice(1);
            }

            return n;
        }

        function formatPhoneForDisplay(phoneNumber) {
            const digits = String(phoneNumber).replace(/[^\d]/g, "");

            // 05017530562 → 050 1753 0562
            if (digits.length === 11) {
                return digits.slice(0, 3) + " " + digits.slice(3, 7) + " " + digits.slice(7);
            }

            // 0312345678 → 03 1234 5678 など
            if (digits.length === 10) {
                return digits.slice(0, 2) + " " + digits.slice(2, 6) + " " + digits.slice(6);
            }

            return digits;
        }

        function isDialableNumber(phoneNumber) {
            return /^\+?\d{8,15}$/.test(phoneNumber);
        }

        function buildDialpadUrl(phoneNumber) {
            const dialNumber = normalizeJapanPhoneNumber(phoneNumber);

            if (!isDialableNumber(dialNumber)) {
                return "";
            }

            const params = new URLSearchParams();

            if (DIALPAD_FROM_NUMBER && DIALPAD_FROM_NUMBER.trim() !== "") {
                params.set("fromNumber", DIALPAD_FROM_NUMBER.trim());
            }

            const query = params.toString();

            // Dialpadアプリへ渡す。
            // confirmPhone=1 は付けないことで、Dialpad内の確認操作をできるだけ減らします。
            return "dialpad://" + encodeURIComponent(dialNumber) + (query ? "?" + query : "");
        }

        function triggerCall(phoneNumber) {
            pendingDisplayNumber = formatPhoneForDisplay(phoneNumber);
            pendingDialpadUrl = buildDialpadUrl(phoneNumber);

            if (!pendingDialpadUrl) {
                alert("このボタンには有効な電話番号が設定されていません。管理者にご確認ください。");
                return;
            }

            document.getElementById("ios-call-action").innerText =
                (isEnglish ? "Call " : "発信 ") + pendingDisplayNumber + ",,,,1";
            document.getElementById("ios-call-cancel").innerText =
                isEnglish ? "Cancel" : "キャンセル";

            document.getElementById("ios-call-overlay").classList.add("active");
        }

        function cancelCall() {
            pendingDisplayNumber = "";
            pendingDialpadUrl = "";
            document.getElementById("ios-call-overlay").classList.remove("active");
        }

        function confirmDialpadCall() {
            if (!pendingDialpadUrl) {
                cancelCall();
                return;
            }

            document.getElementById("ios-call-overlay").classList.remove("active");

            showPage('page-calling');
            // iOS風発信ポップアップが開いている場合の言語更新
            if (document.getElementById("ios-call-overlay").classList.contains("active")) {
                document.getElementById("ios-call-action").innerText =
                    (isEnglish ? "Call " : "発信 ") + pendingDisplayNumber + ",,,,1";
                document.getElementById("ios-call-cancel").innerText =
                    isEnglish ? "Cancel" : "キャンセル";
            }

            updateCallingText();

            // Safari復帰はショートカットアプリのオートメーション側で処理する前提。
            window.location.href = pendingDialpadUrl;
        }

        // 呼出中画面のテキストを言語状態に合わせる
        function updateCallingText() {
            document.getElementById('text-calling-title').innerText = isEnglish ? "Calling Staff..." : "ただいま呼び出しております";
            document.getElementById('text-calling-msg').innerHTML = isEnglish ? "Launching Dialpad app.<br>Please wait a moment." : "Dialpadアプリを起動しています。<br>そのままで少々お待ちください。";
        }

        // ========================================================
        // 🌐 言語切り替えロジック
        // ========================================================
        let isEnglish = false;
        function toggleLanguage() {
            isEnglish = !isEnglish;
            document.getElementById('btn-lang').innerText = isEnglish ? "日本語" : "English";
            
            // 1面
            document.getElementById('text-top-title').innerText = isEnglish ? "Welcome. Please select your business." : "いらっしゃいませ。ご用件をお選びください";
            document.getElementById('btn-general').innerHTML = isEnglish ? "General Reception" : "総合受付";
            document.getElementById('btn-delivery').innerHTML = isEnglish ? "Delivery / Pickup" : "配達・集荷";
            document.getElementById('btn-call').innerHTML = isEnglish ? "Call Staff" : "担当者呼出";
            
            // 2面
            document.getElementById('text-dept-title').innerText = isEnglish ? "Please select a department" : "担当の部署をお選びください";
            document.getElementById('btn-sales').innerHTML = isEnglish ? "Sales Dept." : "営業部";
            document.getElementById('btn-tech').innerHTML = isEnglish ? "Technology Dept." : "技術製造部";
            document.getElementById('btn-gyomu').innerHTML = isEnglish ? "Operations Dept." : "業務部";
            document.getElementById('btn-hirox').innerHTML = isEnglish ? "Hirox Japan Tokyo Office" : "株式会社ハイロックスジャパン東京営業所";
            
            // 3面 タイトル
            document.getElementById('text-sales-title').innerText = isEnglish ? "Please select a staff member (Sales)" : "営業部の担当者をお選びください";
            document.getElementById('text-tech-title').innerText = isEnglish ? "Please select a staff member (Tech)" : "技術製造部の担当者をお選びください";
            document.getElementById('text-gyomu-title').innerText = isEnglish ? "Please select a staff member (Operations)" : "業務部の担当者をお選びください";
            document.getElementById('text-hirox-title').innerText = isEnglish ? "Please select a staff member (Tokyo Office)" : "東京営業所の担当者をお選びください";
            
            // 【自動書き換えシステム】
            const staffButtons = document.querySelectorAll('.staff-btn');
            staffButtons.forEach(btn => {
                const jaName = btn.getAttribute('data-ja');
                const enName = btn.getAttribute('data-en');
                btn.innerHTML = isEnglish ? enName : jaName;
            });
            
            // 戻るボタン
            const backButtons = ['btn-back-1', 'btn-back-2', 'btn-back-3', 'btn-back-4', 'btn-back-5'];
            backButtons.forEach(id => {
                document.getElementById(id).innerText = isEnglish ? "◀ Back" : "◀ 戻る";
            });

            updateCallingText();
        }
    </script>
</body>
</html>
