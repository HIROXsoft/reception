<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>総合受付システム</title>
    <style>
        /* ========================================================
           デザイン調整エリア
           数字や色だけ変更すれば、見た目を調整できます。
           ======================================================== */
        :root {
            --bg-start: #e0f2fe;
            --bg-end: #bae6fd;
            --title-color: #1e3a8a;
            --btn-start: #1d4ed8;
            --btn-end: #3b82f6;
            --btn-green-start: #2f855a;
            --btn-green-end: #48bb78;
            --btn-gray: #64748b;
            --btn-width: 650px;
            --btn-padding: 30px;
            --btn-font-size: 26px;
            --btn-radius: 10px;
            --logo-width: 180px;
            --logo-top: 28px;
            --logo-left: 36px;
            --auto-return-seconds: 45;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .logo {
            position: fixed;
            top: var(--logo-top);
            left: var(--logo-left);
            width: var(--logo-width);
            max-width: 35vw;
            height: auto;
            z-index: 10;
        }

        .page {
            width: 100%;
            max-width: var(--btn-width);
            animation: fadeIn 0.25s ease-in-out;
            text-align: center;
        }

        h1 {
            color: var(--title-color);
            font-size: 32px;
            margin: 0 0 40px;
            font-weight: bold;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-radius: var(--btn-radius);
            padding: var(--btn-padding);
            background: linear-gradient(135deg, var(--btn-start), var(--btn-end));
            color: white;
            font-size: var(--btn-font-size);
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(29, 78, 216, 0.15);
            -webkit-tap-highlight-color: transparent;
        }

        .main-btn:active {
            filter: brightness(0.85);
            transform: scale(0.96);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--btn-green-start), var(--btn-green-end));
            box-shadow: 0 6px 15px rgba(47, 133, 90, 0.15);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            background-color: var(--btn-gray);
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
        }

        .lang-container {
            position: fixed;
            bottom: 60px;
            right: 160px;
            z-index: 10;
        }

        .lang-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--title-color);
            border: 1px solid #bae6fd;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .calling-page {
            display: none;
            text-align: center;
        }

        .status-msg {
            font-size: 24px;
            color: var(--title-color);
            font-weight: bold;
            line-height: 1.6;
            margin: 20px 0 0;
        }

        .sub-msg {
            font-size: 16px;
            color: var(--title-color);
            line-height: 1.7;
            margin-top: 12px;
        }

        .loader {
            border: 6px solid rgba(255, 255, 255, 0.8);
            border-top: 6px solid #1d4ed8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 700px) {
            .logo {
                width: 140px;
                top: 18px;
                left: 18px;
            }

            .lang-container {
                right: 20px;
                bottom: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .main-btn {
                font-size: 22px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <!--
        ロゴ画像について
        GitHubでは index.html と同じ場所に assets フォルダを作り、
        その中に company_logo.png を入れてください。

        例:
        index.html
        assets/company_logo.png

        ファイル名を変える場合は、下の src="assets/company_logo.png" を変更してください。
    -->
    <img class="logo" src="company_logo.png" alt="会社ロゴ" onerror="this.style.display='none'">

    <main id="menu-page" class="page"></main>

    <main id="calling-page" class="page calling-page">
        <h1 id="calling-title">ただいま対応中です</h1>
        <div class="loader"></div>
        <p class="status-msg" id="calling-main-msg">恐れ入りますが、終わりましたら<br>「受付画面へ戻る」をタップしてください。</p>
        <p class="sub-msg" id="calling-sub-msg"></p>
        <button class="back-btn" id="return-btn" type="button">受付画面へ戻る</button>
    </main>

    <div class="lang-container" id="lang-bar">
        <button class="lang-btn" id="lang-btn" type="button">English</button>
    </div>

    <script>
        /* ========================================================
           発信先・ボタン編集エリア
           追加、削除、変更は基本的にここだけ編集してください。
           shortcut は iPhone / iPad のショートカット名と完全一致させます。
           ======================================================== */
        const MENU = [
            { ja: "総合受付", en: "General Reception", shortcut: "受付" },
            { ja: "配達・集荷", en: "Delivery / Pickup", shortcut: "配集" },
            {
                ja: "担当者呼出",
                en: "Call Staff",
                titleJa: "担当の部署をお選びください",
                titleEn: "Please select a department",
                children: [
                    {
                        ja: "営業部",
                        en: "Sales Dept.",
                        titleJa: "営業部の担当者をお選びください",
                        titleEn: "Please select a staff member (Sales)",
                        children: [
                            { ja: "中島 俊和", en: "Toshikazu Nakajima", shortcut: "中島", green: true },
                            { ja: "小林 大真", en: "Oma Kobayashi", shortcut: "小林", green: true },
                            { ja: "前川 泰司", en: "Taiji Maekawa", shortcut: "前川", green: true },
                            { ja: "川越 次郎", en: "Jiro Kawagoe", shortcut: "川越", green: true }
                        ]
                    },
                    {
                        ja: "業務部",
                        en: "Operations Dept.",
                        titleJa: "業務部の担当者をお選びください",
                        titleEn: "Please select a staff member (Operations)",
                        children: [
                            { ja: "吉田 絢香", en: "Ayaka Yoshida", shortcut: "吉田", green: true },
                            { ja: "泉 なぎさ", en: "Nagisa Izumi", shortcut: "泉", green: true },
                            { ja: "西野 花音", en: "Kanon Nishino", shortcut: "西野", green: true }
                        ]
                    },
                    {
                        ja: "技術製造部",
                        en: "Technology Dept.",
                        titleJa: "技術製造部の担当者をお選びください",
                        titleEn: "Please select a staff member (Technology)",
                        children: [
                            { ja: "上代 永", en: "Hisashi Kajiroi", shortcut: "上代", green: true },
                            { ja: "竹内 孝全", en: "Takamasa Takeuchi", shortcut: "竹内", green: true },
                            { ja: "福家 三郎", en: "Saburo Fuke", shortcut: "福家", green: true },
                            { ja: "岡田 拓矢", en: "Takuya Okada", shortcut: "岡田", green: true },
                            { ja: "正岡 正雄", en: "Masao Masaoka", shortcut: "正岡", green: true }
                        ]
                    },
                    {
                        ja: "株式会社ハイロックスジャパン東京営業所",
                        en: "Hirox Japan Tokyo Office",
                        titleJa: "東京営業所の担当者をお選びください",
                        titleEn: "Please select a staff member (Tokyo Office)",
                        green: true,
                        children: [
                            { ja: "東京 太郎", en: "Taro Tokyo", shortcut: "東太郎", green: true },
                            { ja: "東京 花子", en: "Hanako Tokyo", shortcut: "東花子", green: true }
                        ]
                    }
                ]
            }
        ];

        const TEXT = {
            topTitle: { ja: "いらっしゃいませ。ご用件をお選びください", en: "Welcome. Please select your business." },
            back: { ja: "◀ 戻る", en: "◀ Back" },
            callingTitle: { ja: "ただいま対応中です", en: "Currently responding" },
            callingMain: { ja: "恐れ入りますが、終わりましたら<br>「受付画面へ戻る」をタップしてください。", en: "When finished,<br>please tap “Return to reception screen.”" },
            callingSub: { ja: "", en: "" },
            returnTop: { ja: "受付画面へ戻る", en: "Return to reception screen" }
        };

        const AUTO_RETURN_SECONDS = 45;

        let isEnglish = false;
        let menuHistory = [];
        let autoReturnTimer = null;
        let callStartTime = null;

        const menuPage = document.getElementById("menu-page");
        const callingPage = document.getElementById("calling-page");
        const langBar = document.getElementById("lang-bar");
        const langBtn = document.getElementById("lang-btn");
        const returnBtn = document.getElementById("return-btn");
        

        function label(item) {
            return isEnglish ? (item.en || item.ja) : item.ja;
        }

        function text(key) {
            return isEnglish ? TEXT[key].en : TEXT[key].ja;
        }

        function currentGroup() {
            return menuHistory.length ? menuHistory[menuHistory.length - 1] : null;
        }

        function currentItems() {
            const group = currentGroup();
            return group ? group.children : MENU;
        }

        function currentTitle() {
            const group = currentGroup();
            if (!group) return text("topTitle");
            return isEnglish ? (group.titleEn || group.en || group.ja) : (group.titleJa || group.ja);
        }

        function renderMenu() {
            menuPage.innerHTML = "";

            const title = document.createElement("h1");
            title.textContent = currentTitle();
            menuPage.appendChild(title);

            const container = document.createElement("div");
            container.className = "btn-container";
            menuPage.appendChild(container);

            currentItems().forEach(function(item) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = item.green ? "main-btn btn-green" : "main-btn";
                button.textContent = label(item);

                if (item.children && item.children.length) {
                    button.addEventListener("click", function() {
                        menuHistory.push(item);
                        renderMenu();
                    });
                } else if (item.shortcut) {
                    button.addEventListener("click", function() {
                        runShortcut(item.shortcut);
                    });
                }

                container.appendChild(button);
            });

            if (menuHistory.length) {
                const backButton = document.createElement("button");
                backButton.type = "button";
                backButton.className = "back-btn";
                backButton.textContent = text("back");
                backButton.addEventListener("click", function() {
                    menuHistory.pop();
                    renderMenu();
                });
                menuPage.appendChild(backButton);
            }
        }

        function shortcutUrl(shortcutName) {
            return "shortcuts://x-callback-url/run-shortcut?name=" + encodeURIComponent(shortcutName);
        }

        function openShortcut(shortcutName) {
            window.location.href = shortcutUrl(shortcutName);
        }

        function runShortcut(shortcutName) {
            /*
               iPad / iPhone のSafariでは、カスタムURLの起動は
               「ボタンを押した直後の処理」で行う必要があります。

               shortcuts://run-shortcut よりも
               shortcuts://x-callback-url/run-shortcut の方が安定する場合があるため、
               こちらを使います。
            */
            // 先にショートカットを起動します。
            openShortcut(shortcutName);

            // 受付画面側は呼出中画面に切り替えます。
            showCallingPage();
        }

        function showCallingPage() {
            menuPage.style.display = "none";
            callingPage.style.display = "block";
            langBar.style.display = "none";
            updateCallingText();
            startAutoReturnTimer();
        }

        function showMenuPage() {
            clearAutoReturnTimer();
            callingPage.style.display = "none";
            menuPage.style.display = "block";
            langBar.style.display = "block";
            menuHistory = [];
            renderMenu();
        }

        function startAutoReturnTimer() {
            clearAutoReturnTimer();
            callStartTime = Date.now();
            autoReturnTimer = window.setTimeout(showMenuPage, AUTO_RETURN_SECONDS * 1000);
        }

        function clearAutoReturnTimer() {
            if (autoReturnTimer) {
                window.clearTimeout(autoReturnTimer);
                autoReturnTimer = null;
            }
            callStartTime = null;
        }

        function checkAutoReturnAfterSafariResume() {
            if (!callStartTime || callingPage.style.display !== "block") return;
            const elapsedSeconds = Math.floor((Date.now() - callStartTime) / 1000);
            if (elapsedSeconds >= AUTO_RETURN_SECONDS) {
                showMenuPage();
            } else {
                if (autoReturnTimer) window.clearTimeout(autoReturnTimer);
                autoReturnTimer = window.setTimeout(showMenuPage, (AUTO_RETURN_SECONDS - elapsedSeconds) * 1000);
            }
        }

        function updateCallingText() {
            document.getElementById("calling-title").textContent = text("callingTitle");
            document.getElementById("calling-main-msg").innerHTML = text("callingMain");
            document.getElementById("calling-sub-msg").textContent = text("callingSub");
            returnBtn.textContent = text("returnTop");
            
        }

        langBtn.addEventListener("click", function() {
            isEnglish = !isEnglish;
            langBtn.textContent = isEnglish ? "日本語" : "English";
            renderMenu();
            updateCallingText();
        });

        returnBtn.addEventListener("click", showMenuPage);

        window.addEventListener("focus", checkAutoReturnAfterSafariResume);
        document.addEventListener("visibilitychange", function() {
            if (!document.hidden) checkAutoReturnAfterSafariResume();
        });

        renderMenu();
    </script>
</body>
</html>
