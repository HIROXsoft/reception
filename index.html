<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合受付システム</title>
    <style>
        /* ========================================================
           デザイン調整
           数字や色だけ変更すれば、画面全体の見た目を調整できます。
           ======================================================== */
        :root {
            --bg-start: #e0f2fe;
            --bg-end: #bae6fd;
            --btn-start: #1d4ed8;
            --btn-end: #3b82f6;
            --btn-green-start: #2f855a;
            --btn-green-end: #48bb78;
            --btn-padding: 30px;
            --btn-font-size: 26px;
            --btn-radius: 10px;
            --lang-font-size: 16px;
            --lang-padding-y: 12px;
            --lang-padding-x: 24px;
            --lang-radius: 30px;
            --lang-position-bottom: 60px;
            --lang-position-right: 160px;
        }

        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: #1e3a8a;
            font-size: 32px;
            margin: 0 0 40px;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
        }

        .page {
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-radius: var(--btn-radius);
            padding: var(--btn-padding);
            background: linear-gradient(135deg, var(--btn-start), var(--btn-end));
            color: white;
            font-size: var(--btn-font-size);
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(29, 78, 216, 0.15);
            transition: transform 0.1s, filter 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .main-btn:active {
            filter: brightness(0.85);
            transform: scale(0.96);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--btn-green-start), var(--btn-green-end));
            box-shadow: 0 6px 15px rgba(47, 133, 90, 0.15);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            background-color: #64748b;
            color: white;
            font-size: 18px;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
        }

        .back-btn:active {
            background-color: #475569;
        }

        .lang-container {
            position: fixed;
            bottom: var(--lang-position-bottom);
            right: var(--lang-position-right);
        }

        .lang-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: #1e3a8a;
            border: 1px solid #bae6fd;
            font-size: var(--lang-font-size);
            font-weight: bold;
            padding: var(--lang-padding-y) var(--lang-padding-x);
            border-radius: var(--lang-radius);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.1s, background-color 0.1s;
        }

        .lang-btn:active {
            background-color: #e0f2fe;
            transform: scale(0.95);
        }

        .calling-page {
            display: none;
            text-align: center;
        }

        .status-msg {
            font-size: 24px;
            color: #1e3a8a;
            font-weight: bold;
            margin-top: 20px;
            line-height: 1.6;
        }

        .sub-msg {
            font-size: 16px;
            color: #1e3a8a;
            font-weight: normal;
            line-height: 1.7;
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #1d4ed8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <main id="menu-page" class="page"></main>

    <main id="calling-page" class="page calling-page">
        <h1 id="calling-title">ただいま呼び出しております</h1>
        <div class="loader"></div>
        <p class="status-msg" id="calling-main-msg">起動しています。<br>そのままで少々お待ちください。</p>
        <p class="sub-msg" id="calling-sub-msg">通話中…</p>
        <button class="back-btn" id="return-btn" type="button">受付画面へ戻る</button>
    </main>

    <div class="lang-container" id="lang-bar">
        <button class="lang-btn" id="lang-btn" type="button">English</button>
    </div>

    <script>
        /* ========================================================
           発信先・ボタン編集エリア
           ========================================================

           【編集方法】
           1. ボタンを追加する場合
              下の MENU に、同じ形の行をコピーして追加してください。

           2. ボタンを削除する場合
              不要な { ... } のかたまりを削除してください。

           3. 発信先を変更する場合
              shortcut: "受付" の "受付" 部分を、ショートカット名に合わせて変更してください。

           4. 階層を作る場合
              children: [ ... ] の中にボタンを入れると、次の画面が作られます。

           5. 緑色ボタンにしたい場合
              green: true を付けてください。

           ※ shortcut 名は、iPadの「ショートカット」アプリ内の名前と完全一致させてください。
           ※ 電話番号やDialpadの処理はHTML内には置かず、各ショートカット側で設定してください。
        */
        const MENU = [
            { ja: "総合受付", en: "General Reception", shortcut: "受付" },
            { ja: "配達・集荷", en: "Delivery / Pickup", shortcut: "配集" },
            {
                ja: "担当者呼出",
                en: "Call Staff",
                titleJa: "担当の部署をお選びください",
                titleEn: "Please select a department",
                children: [
                    {
                        ja: "営業部",
                        en: "Sales Dept.",
                        titleJa: "営業部の担当者をお選びください",
                        titleEn: "Please select a staff member (Sales)",
                        children: [
                            { ja: "中島 俊和", en: "Toshikazu Nakajima", shortcut: "中島", green: true },
                            { ja: "小林 大真", en: "Oma Kobayashi", shortcut: "小林", green: true },
                            { ja: "前川 泰司", en: "Taiji Maekawa", shortcut: "前川", green: true },
                            { ja: "川越 次郎", en: "Jiro Kawagoe", shortcut: "川越", green: true }
                        ]
                    },
                    {
                        ja: "業務部",
                        en: "Operations Dept.",
                        titleJa: "業務部の担当者をお選びください",
                        titleEn: "Please select a staff member (Operations)",
                        children: [
                            { ja: "吉田 絢香", en: "Ayaka Yoshida", shortcut: "吉田", green: true },
                            { ja: "泉 なぎさ", en: "Nagisa Izumi", shortcut: "泉", green: true },
                            { ja: "西野 花音", en: "Kanon Nishino", shortcut: "西野", green: true }
                        ]
                    },
                    {
                        ja: "技術製造部",
                        en: "Technology Dept.",
                        titleJa: "技術製造部の担当者をお選びください",
                        titleEn: "Please select a staff member (Technology)",
                        children: [
                            { ja: "上代 永", en: "Hisashi Kajiroi", shortcut: "上代", green: true },
                            { ja: "竹内 孝全", en: "Takamasa Takeuchi", shortcut: "竹内", green: true },
                            { ja: "福家 三郎", en: "Saburo Fuke", shortcut: "福家", green: true },
                            { ja: "岡田 拓矢", en: "Takuya Okada", shortcut: "岡田", green: true },
                            { ja: "正岡 正雄", en: "Masao Masaoka", shortcut: "正岡", green: true }
                        ]
                    },
                    {
                        ja: "株式会社ハイロックスジャパン東京営業所",
                        en: "Hirox Japan Tokyo Office",
                        titleJa: "東京営業所の担当者をお選びください",
                        titleEn: "Please select a staff member (Tokyo Office)",
                        green: true,
                        children: [
                            { ja: "東京 太郎", en: "Taro Tokyo", shortcut: "東太郎", green: true },
                            { ja: "東京 花子", en: "Hanako Tokyo", shortcut: "東花子", green: true }
                        ]
                    }
                ]
            }
        ];

        const TEXT = {
            topTitle: {
                ja: "いらっしゃいませ。ご用件をお選びください",
                en: "Welcome. Please select your business."
            },
            back: {
                ja: "◀ 戻る",
                en: "◀ Back"
            },
            callingTitle: {
                ja: "ただいま呼び出しております",
                en: "Calling Staff..."
            },
            callingMain: {
                ja: "起動しています。<br>そのままで少々お待ちください。",
                en: "Launching the iPhone shortcut.<br>Please wait a moment."
            },
            callingSub: {
                ja: "通話中...",
                en: "Please set the return to the reception screen in the shortcut."
            },
            returnTop: {
                ja: "受付画面へ戻る",
                en: "Return to reception screen"
            }
        };

        let isEnglish = false;
        let menuHistory = [];

        const menuPage = document.getElementById("menu-page");
        const callingPage = document.getElementById("calling-page");
        const langBar = document.getElementById("lang-bar");
        const langBtn = document.getElementById("lang-btn");
        const returnBtn = document.getElementById("return-btn");

        function label(item) {
            return isEnglish ? (item.en || item.ja) : item.ja;
        }

        function text(key) {
            return isEnglish ? TEXT[key].en : TEXT[key].ja;
        }

        function currentGroup() {
            return menuHistory.length ? menuHistory[menuHistory.length - 1] : null;
        }

        function currentItems() {
            const group = currentGroup();
            return group ? group.children : MENU;
        }

        function currentTitle() {
            const group = currentGroup();
            if (!group) return text("topTitle");
            return isEnglish ? (group.titleEn || group.en || group.ja) : (group.titleJa || group.ja);
        }

        function renderMenu() {
            menuPage.innerHTML = "";

            const title = document.createElement("h1");
            title.textContent = currentTitle();
            menuPage.appendChild(title);

            const container = document.createElement("div");
            container.className = "btn-container";
            menuPage.appendChild(container);

            currentItems().forEach(function(item) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = item.green ? "main-btn btn-green" : "main-btn";
                button.textContent = label(item);

                if (item.children && item.children.length) {
                    button.addEventListener("click", function() {
                        menuHistory.push(item);
                        renderMenu();
                    });
                } else if (item.shortcut) {
                    button.addEventListener("click", function() {
                        runShortcut(item.shortcut);
                    });
                }

                container.appendChild(button);
            });

            if (menuHistory.length) {
                const backButton = document.createElement("button");
                backButton.type = "button";
                backButton.className = "back-btn";
                backButton.textContent = text("back");
                backButton.addEventListener("click", function() {
                    menuHistory.pop();
                    renderMenu();
                });
                menuPage.appendChild(backButton);
            }
        }

        function runShortcut(shortcutName) {
            showCallingPage();
            const shortcutUrl = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName);
            window.location.href = shortcutUrl;
        }

        function showCallingPage() {
            menuPage.style.display = "none";
            callingPage.style.display = "block";
            langBar.style.display = "none";
            updateCallingText();
        }

        function showMenuPage() {
            callingPage.style.display = "none";
            menuPage.style.display = "block";
            langBar.style.display = "block";
            menuHistory = [];
            renderMenu();
        }

        function updateCallingText() {
            document.getElementById("calling-title").textContent = text("callingTitle");
            document.getElementById("calling-main-msg").innerHTML = text("callingMain");
            document.getElementById("calling-sub-msg").textContent = text("callingSub");
            returnBtn.textContent = text("returnTop");
        }

        langBtn.addEventListener("click", function() {
            isEnglish = !isEnglish;
            langBtn.textContent = isEnglish ? "日本語" : "English";
            renderMenu();
            updateCallingText();
        });

        returnBtn.addEventListener("click", showMenuPage);

        renderMenu();
    </script>
</body>
</html>
