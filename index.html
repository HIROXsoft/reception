<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=yes" />
  <title>受付画面</title>
  <style>
    :root {
      --blue: #1f78d1;
      --navy: #1e3a68;
      --sky1: #e7f9ff;
      --sky2: #b8e3fb;
      --white: #ffffff;
      --gray: #6b7280;
      --shadow: 0 18px 45px rgba(22, 48, 91, 0.18);
      --radius: 28px;
      --auto-return-seconds: 30;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", system-ui, sans-serif;
      color: var(--navy);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(135deg, var(--sky1), var(--sky2));
    }

    body {
      display: grid;
      place-items: stretch;
    }

    button, a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      background: linear-gradient(135deg, var(--sky1), var(--sky2));
    }

    .screen.active {
      display: flex;
    }

    .logo {
      position: absolute;
      top: clamp(22px, 2.2vw, 54px);
      left: clamp(28px, 3vw, 76px);
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 5;
    }

    .logo img {
      width: clamp(160px, 12vw, 360px);
      max-height: 110px;
      object-fit: contain;
      display: none;
    }

    .logo.has-image img { display: block; }
    .logo.has-image .logo-fallback { display: none; }

    .logo-fallback {
      min-width: clamp(160px, 12vw, 320px);
      padding: 18px 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: var(--shadow);
      color: var(--navy);
      font-weight: 800;
      font-size: clamp(28px, 2.2vw, 56px);
      letter-spacing: 0.04em;
      text-align: center;
    }

    .home-wrap {
      width: min(92vw, 1800px);
      margin: auto;
      padding: clamp(80px, 8vh, 180px) clamp(40px, 5vw, 110px) clamp(42px, 5vh, 90px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(34px, 4vh, 76px);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(46px, 4vw, 112px);
      line-height: 1.25;
      color: var(--navy);
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .menu-grid {
      width: min(100%, 1380px);
      display: grid;
      grid-template-columns: repeat(2, minmax(360px, 1fr));
      gap: clamp(32px, 3vw, 72px);
      align-items: stretch;
    }

    .main-button {
      min-height: clamp(210px, 18vh, 380px);
      width: 100%;
      border: 0;
      border-radius: var(--radius);
      color: white;
      background: linear-gradient(180deg, #2d8fe8, var(--blue));
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .main-button:active {
      transform: scale(0.985);
      filter: brightness(0.96);
    }

    .button-ja {
      display: block;
      font-size: clamp(50px, 4.2vw, 118px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.04em;
    }

    .button-en {
      display: none !important;
    }

    .sub-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill-button {
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--navy);
      box-shadow: 0 8px 24px rgba(22, 48, 91, 0.12);
      padding: clamp(16px, 1.2vw, 28px) clamp(34px, 2.5vw, 60px);
      font-size: clamp(24px, 1.6vw, 42px);
      font-weight: 800;
      cursor: pointer;
    }

    .fullscreen-icon-button {
      position: fixed;
      top: clamp(18px, 1.5vw, 34px);
      right: clamp(18px, 1.5vw, 34px);
      z-index: 20;
      width: clamp(46px, 3.2vw, 72px);
      height: clamp(46px, 3.2vw, 72px);
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.86);
      color: var(--navy);
      box-shadow: 0 8px 22px rgba(22, 48, 91, 0.14);
      font-size: clamp(22px, 1.7vw, 38px);
      font-weight: 900;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .fullscreen-icon-button:active {
      transform: scale(0.94);
    }

    .status-wrap {
      width: min(92vw, 1500px);
      margin: auto;
      padding: clamp(50px, 6vh, 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(34px, 4vh, 70px);
    }

    .status-card {
      width: min(100%, 1180px);
      padding: clamp(52px, 5vw, 120px);
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(26px, 3vh, 58px);
    }

    .status-title {
      margin: 0;
      font-size: clamp(48px, 4vw, 110px);
      font-weight: 900;
      line-height: 1.25;
    }

    .status-text {
      margin: 0;
      white-space: pre-line;
      font-size: clamp(30px, 2.4vw, 64px);
      font-weight: 800;
      line-height: 1.55;
    }

    .spinner {
      width: clamp(72px, 6vw, 150px);
      height: clamp(72px, 6vw, 150px);
      border-radius: 50%;
      border: clamp(9px, 0.8vw, 18px) solid rgba(31, 58, 104, 0.18);
      border-top-color: var(--blue);
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .return-button {
      border: 0;
      border-radius: 999px;
      background: var(--gray);
      color: white;
      padding: clamp(22px, 1.8vw, 42px) clamp(54px, 4vw, 96px);
      font-size: clamp(28px, 2vw, 54px);
      font-weight: 900;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .map-screen {
      padding: clamp(14px, 1.2vw, 32px);
      flex-direction: column;
      gap: clamp(10px, 1vh, 20px);
    }

    .map-frame {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      padding: clamp(8px, 0.7vw, 18px);
    }

    .map-frame img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      display: none;
      background: white;
    }

    .map-frame.has-image img { display: block; }
    .map-frame.has-image .map-placeholder { display: none; }

    .map-placeholder {
      width: min(90%, 1350px);
      min-height: 60%;
      border: 5px dashed rgba(31, 58, 104, 0.28);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(40px, 4vw, 90px);
      color: var(--navy);
      background: rgba(255, 255, 255, 0.65);
      gap: 24px;
    }

    .map-placeholder strong {
      font-size: clamp(38px, 3vw, 82px);
      font-weight: 900;
    }

    .map-placeholder span {
      font-size: clamp(24px, 1.7vw, 46px);
      font-weight: 700;
      line-height: 1.55;
    }

    .map-footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 1.2vw, 28px);
      flex-wrap: wrap;
      padding-bottom: 0;
    }

    .map-footer .countdown {
      padding: clamp(10px, 0.8vw, 18px) clamp(22px, 1.6vw, 40px);
      font-size: clamp(18px, 1.1vw, 30px);
    }

    .map-footer .return-button {
      padding: clamp(12px, 0.9vw, 20px) clamp(30px, 2vw, 52px);
      font-size: clamp(18px, 1.2vw, 32px);
    }

    .countdown {
      min-width: clamp(250px, 18vw, 480px);
      border-radius: 999px;
      padding: clamp(18px, 1.4vw, 32px) clamp(30px, 2.5vw, 60px);
      background: rgba(255, 255, 255, 0.88);
      color: var(--navy);
      font-size: clamp(24px, 1.6vw, 46px);
      font-weight: 900;
      text-align: center;
      box-shadow: 0 8px 22px rgba(22, 48, 91, 0.12);
    }

    .error {
      display: none;
      color: #b91c1c;
      font-size: clamp(22px, 1.5vw, 40px);
      font-weight: 800;
      line-height: 1.45;
    }

    .error.visible { display: block; }

    @media (max-aspect-ratio: 1/1) {
      .menu-grid { grid-template-columns: 1fr; }
      .main-button { min-height: 180px; }
    }
  </style>
</head>
<body>
  <button id="fullscreenButton" class="fullscreen-icon-button" type="button" aria-label="全画面" title="全画面">⛶</button>
  <section id="homeScreen" class="screen active" aria-label="受付メニュー">
    <div id="logoBox" class="logo">
      <img id="companyLogo" src="company_logo.png" alt="Company Logo" />
      <div class="logo-fallback">HIROX</div>
    </div>

    <main class="home-wrap">
      <h1 id="mainTitle">いらっしゃいませ。<br>ご用件をお選びください</h1>

      <div class="menu-grid">
        <button class="main-button" type="button" data-action="reception">
          <span class="button-ja" data-i18n-ja="総合受付" data-i18n-en="General Reception">総合受付</span>
        </button>

        <button class="main-button" type="button" data-action="map">
          <span class="button-ja" data-i18n-ja="配達・集荷" data-i18n-en="Delivery / Pickup">配達・集荷</span>
        </button>
      </div>

      <div class="sub-controls">
        <button id="languageButton" class="pill-button" type="button">English</button>
      </div>
    </main>
  </section>

  <section id="callingScreen" class="screen" aria-label="対応中画面">
    <div id="logoBoxCalling" class="logo">
      <img id="companyLogoCalling" src="company_logo.png" alt="Company Logo" />
      <div class="logo-fallback">HIROX</div>
    </div>

    <main class="status-wrap">
      <div class="status-card">
        <h2 id="callingTitle" class="status-title">ただいま対応中です</h2>
        <div class="spinner" aria-hidden="true"></div>
        <p id="callingText" class="status-text">恐れ入りますが、終わりましたら<br>「受付画面へ戻る」をタップしてください。</p>
        <p id="errorText" class="error"></p>
        <div id="callingCountdown" class="countdown">30秒後に自動で戻ります</div>
        <button id="returnFromCalling" class="return-button" type="button">受付画面へ戻る</button>
      </div>
    </main>
  </section>

  <section id="mapScreen" class="screen map-screen" aria-label="配達・集荷マップ">
    <div id="mapFrame" class="map-frame">
      <img id="mapGuideImage" src="map_guide.png" alt="配達・集荷マップガイド" />
      <div class="map-placeholder">
        <strong>配達・集荷マップ</strong>
        <span>同じフォルダに <b>map_guide.png</b> を置くと、ここに案内画像が表示されます。<br>jpg画像を使う場合は、このHTML内の <b>MAP_IMAGE_FILE</b> を変更してください。</span>
      </div>
    </div>
    <footer class="map-footer">
      <div id="mapCountdown" class="countdown">30秒後に自動で戻ります</div>
      <button id="returnFromMap" class="return-button" type="button">受付画面へ戻る</button>
    </footer>
  </section>

    const state = {
      isEnglish: false,
      autoReturnTimer: null,
      countdownTimer: null,
      autoReturnStartTime: null,
      activeCountdownElement: null
    };

    const screens = {
      home: document.getElementById("homeScreen"),
      calling: document.getElementById("callingScreen"),
      map: document.getElementById("mapScreen")
    };

    const text = {
      ja: {
        title: "いらっしゃいませ。<br>ご用件をお選びください",
        langButton: "English",
        fullscreen: "全画面",
        callingTitle: "ただいま対応中です",
        callingText: "恐れ入りますが、終わりましたら<br>「受付画面へ戻る」をタップしてください。",
        returnHome: "受付画面へ戻る",
        countdown: sec => `${sec}秒後に自動で戻ります`,
        popupBlocked: "外部アプリまたはURLを開けませんでした。設定URLをご確認ください。"
      },
      en: {
        title: "Welcome.<br>Please select your business.",
        langButton: "日本語",
        fullscreen: "Full Screen",
        callingTitle: "Calling Staff...",
        callingText: "Please tap “Return to reception screen”<br>when finished.",
        returnHome: "Return to reception screen",
        countdown: sec => `Returning automatically in ${sec} seconds`,
        popupBlocked: "Could not open the external app or URL. Please check the configured URL."
      }
    };

    function currentText() {
      return state.isEnglish ? text.en : text.ja;
    }

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove("active"));
      screens[name].classList.add("active");
    }

    function startAutoReturn(countdownElement) {
      clearAutoReturn();
      state.autoReturnStartTime = Date.now();
      state.activeCountdownElement = countdownElement;
      updateCountdown();

      state.autoReturnTimer = window.setTimeout(returnToHome, AUTO_RETURN_SECONDS * 1000);
      state.countdownTimer = window.setInterval(updateCountdown, 250);
    }

    function clearAutoReturn() {
      if (state.autoReturnTimer) window.clearTimeout(state.autoReturnTimer);
      if (state.countdownTimer) window.clearInterval(state.countdownTimer);
      state.autoReturnTimer = null;
      state.countdownTimer = null;
      state.autoReturnStartTime = null;
      state.activeCountdownElement = null;
    }

    function updateCountdown() {
      if (!state.activeCountdownElement || !state.autoReturnStartTime) return;
      const elapsed = Math.floor((Date.now() - state.autoReturnStartTime) / 1000);
      const remaining = Math.max(0, AUTO_RETURN_SECONDS - elapsed);
      state.activeCountdownElement.textContent = currentText().countdown(remaining);
    }

    function returnToHome() {
      clearAutoReturn();
      document.getElementById("errorText").classList.remove("visible");
      document.getElementById("errorText").textContent = "";
      showScreen("home");
    }

    function openReception() {
      // 先に画面を「ただいま対応中です」に切り替えます。
      // その後、同じタブ内でDialpadアプリを起動します。
      showScreen("calling");
      startAutoReturn(document.getElementById("callingCountdown"));

      if (!GENERAL_RECEPTION_URL) return;

      try {
        launchDialpadWithoutNewTab(GENERAL_RECEPTION_URL);
      } catch (error) {
        showError(currentText().popupBlocked);
      }
    }

    function launchDialpadWithoutNewTab(url) {
      // window.open() や target="_blank" は使わず、非表示iframeで
      // dialpad:// を呼び出します。これにより新しいタブやポップアップを出しません。
      const previousFrame = document.getElementById("dialpadLaunchFrame");
      if (previousFrame) previousFrame.remove();

      const frame = document.createElement("iframe");
      frame.id = "dialpadLaunchFrame";
      frame.title = "Dialpad Launcher";
      frame.setAttribute("aria-hidden", "true");
      frame.style.position = "fixed";
      frame.style.width = "1px";
      frame.style.height = "1px";
      frame.style.left = "-10px";
      frame.style.top = "-10px";
      frame.style.opacity = "0";
      frame.style.pointerEvents = "none";
      document.body.appendChild(frame);
      frame.src = url;

      window.setTimeout(() => {
        const currentFrame = document.getElementById("dialpadLaunchFrame");
        if (currentFrame) currentFrame.remove();
      }, 3000);
    }

    function showMapGuide() {
      showScreen("map");
      startAutoReturn(document.getElementById("mapCountdown"));
    }

    function showError(message) {
      const errorText = document.getElementById("errorText");
      errorText.textContent = message;
      errorText.classList.add("visible");
    }

    function applyLanguage() {
      const t = currentText();
      document.getElementById("mainTitle").innerHTML = t.title;
      document.getElementById("languageButton").textContent = t.langButton;
      document.getElementById("fullscreenButton").setAttribute("aria-label", t.fullscreen);
      document.getElementById("fullscreenButton").setAttribute("title", t.fullscreen);
      document.getElementById("callingTitle").textContent = t.callingTitle;
      document.getElementById("callingText").innerHTML = t.callingText;
      document.getElementById("returnFromCalling").textContent = t.returnHome;
      document.getElementById("returnFromMap").textContent = t.returnHome;
      updateCountdown();

      document.querySelectorAll("[data-i18n-ja]").forEach(element => {
        element.textContent = state.isEnglish ? element.dataset.i18nEn : element.dataset.i18nJa;
      });
    }

    function toggleFullscreen() {
      const root = document.documentElement;
      if (!document.fullscreenElement && root.requestFullscreen) {
        root.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function setupImages() {
      const logoBoxes = [document.getElementById("logoBox"), document.getElementById("logoBoxCalling")];
      const logos = [document.getElementById("companyLogo"), document.getElementById("companyLogoCalling")];
      logos.forEach((logo, index) => {
        logo.src = COMPANY_LOGO_FILE;
        logo.onload = () => logoBoxes[index].classList.add("has-image");
        logo.onerror = () => logoBoxes[index].classList.remove("has-image");
      });

      const mapFrame = document.getElementById("mapFrame");
      const mapImage = document.getElementById("mapGuideImage");
      mapImage.src = MAP_IMAGE_FILE;
      mapImage.onload = () => mapFrame.classList.add("has-image");
      mapImage.onerror = () => mapFrame.classList.remove("has-image");
    }

    document.querySelector('[data-action="reception"]').addEventListener("click", openReception);
    document.querySelector('[data-action="map"]').addEventListener("click", showMapGuide);
    document.getElementById("returnFromCalling").addEventListener("click", returnToHome);
    document.getElementById("returnFromMap").addEventListener("click", returnToHome);
    document.getElementById("languageButton").addEventListener("click", () => {
      state.isEnglish = !state.isEnglish;
      applyLanguage();
    });
    document.getElementById("fullscreenButton").addEventListener("click", toggleFullscreen);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.autoReturnStartTime) {
        const elapsed = (Date.now() - state.autoReturnStartTime) / 1000;
        if (elapsed >= AUTO_RETURN_SECONDS) returnToHome();
      }
    });

    setupImages();
    applyLanguage();
  </script>
</body>
</html>
